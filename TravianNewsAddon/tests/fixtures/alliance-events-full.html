  markup is reconstructed to match the three approved Polish event wordings and
  the verified coordinate-link contract (`/karte.php?x=<int>&y=<int>`).

  Sanitization: actor display names and profile ids are synthetic; coordinates are
  ASCII signed integers in the URL query string. No cookies, tokens, session data,
  HAR headers, reports, alliance names, or live player metadata are present.

  Contract anchors:
    - założył(a) nową osadę -> /karte.php?x=89&y=-97    (visible text "(89|-97)")
    - podbił(a) osadę      -> /karte.php?x=-139&y=-27  (visible text "(-139|-27)")
    - utracił(a) osadę     -> /karte.php?x=-127&y=-53  (visible text "(-127|-53)")
-->
